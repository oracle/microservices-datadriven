logging:
  structured:
    format:
      console: logstash

management:
  otlp:
    metrics:
      export:
        enabled: ${MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED:true}
  tracing:
    export:
      otlp:
        enabled: ${MANAGEMENT_OTLP_TRACING_EXPORT_ENABLED:true}

app:
  observability:
    state-refresh-ms: ${TICKET_STATE_REFRESH_MS:10000}
