okafka:
  topic:
    tickets: ticket_event
  walletDir: ${WALLET_DIR:.}
  tnsAdmin: ${TNS_ALIAS:FREEPDB1}
  bootstrapServers: ${OKAFKA_BOOTSTRAP_SERVERS:localhost:1522}
  securityProtocol: ${OKAFKA_SECURITY_PROTOCOL:PLAINTEXT}

app:
  ai:
    chat-model-id: ${OCI_CHAT_MODEL_ID:cohere.command-a-03-2025}
  events:
    retry:
      max-attempts: ${TICKET_EVENT_MAX_ATTEMPTS:3}
      backoff-ms: ${TICKET_EVENT_RETRY_BACKOFF_MS:250}
  true-cache:
    jdbc-url: ${TRUE_CACHE_JDBC_URL:jdbc:oracle:thin:@//localhost:1523/FREEPDB1_TC?oracle.jdbc.provider.traceEventListener=open-telemetry-trace-event-listener-provider}
    db-unique-name: ${TRUE_CACHE_DB_UNIQUE_NAME:TRUEFREE}
    username: ${TRUE_CACHE_DB_USERNAME:${APP_DB_USERNAME}}
    password: ${TRUE_CACHE_DB_PASSWORD:${APP_DB_PASSWORD}}
    max-pool-size: ${TRUE_CACHE_MAX_POOL_SIZE:8}

logging:
  structured:
    format:
      console: logstash
  level:
    org.oracle.okafka: WARN
    org.apache.kafka: WARN

spring:
  ai:
    model:
      chat: oci-genai
      embedding: oci-genai
    oci:
      genai:
        authentication-type: ${OCI_AUTHENTICATION_TYPE:FILE}
        config-file: ${OCI_CONFIG_FILE:${user.home}/.oci/config}
        profile: ${OCI_PROFILE:DEFAULT}
        chat:
          compartment-id: ${OCI_COMPARTMENT_ID}
          serving-mode: ON_DEMAND
          model: ${OCI_CHAT_MODEL_ID:cohere.command-a-03-2025}
          temperature: 0.2
          max-tokens: 1024
        embedding:
          compartment-id: ${OCI_COMPARTMENT_ID}
          serving-mode: ON_DEMAND
          model: ${OCI_EMBEDDING_MODEL_ID:cohere.embed-v4.0}
          dimensions: 1536
          truncate: END
  application:
    name: ${OTEL_SERVICE_NAME:customer-support-lab-v2}
  jmx:
    enabled: true
  datasource:
    username: ${APP_DB_USERNAME}
    password: ${APP_DB_PASSWORD}
    url: ${JDBC_URL:jdbc:oracle:thin:@//localhost:1522/FREEPDB1?oracle.jdbc.provider.traceEventListener=open-telemetry-trace-event-listener-provider}

    driver-class-name: oracle.jdbc.OracleDriver
    type: oracle.ucp.jdbc.PoolDataSource
    oracleucp:
      initial-pool-size: 1
      min-pool-size: 1
      max-pool-size: 30
      connection-pool-name: DemoConnectionPool
      connection-factory-class-name: oracle.jdbc.pool.OracleDataSource
server:
  port: 9001
management:
  metrics:
    distribution:
      # Explicit finite buckets support aggregatable p95 panels over OTLP.
      # Function timers from UCP remain mean/peak metrics, not percentiles.
      slo:
        http.server.requests: 5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2s,5s,10s
        support.ticket.read.latency: 1ms,5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,3s,5s
        support.ticket.processing: 10ms,100ms,500ms,1s,2s,5s,10s,30s,60s,120s
        support.ticket.event.age: 100ms,500ms,1s,2s,5s,10s,30s,60s,120s,300s
        support.ticket.enrichment.step: 1ms,10ms,50ms,100ms,250ms,500ms,1s,2s,5s,10s,30s,60s
        gen_ai.client.operation: 10ms,50ms,100ms,250ms,500ms,1s,2s,5s,10s,30s,60s
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
  opentelemetry:
    resource-attributes:
      service.name: ${OTEL_SERVICE_NAME:${spring.application.name}}
    tracing:
      export:
        otlp:
          endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
    logging:
      export:
        otlp:
          endpoint: ${MANAGEMENT_OTLP_LOGGING_ENDPOINT:http://localhost:4318/v1/logs}
  otlp:
    metrics:
      export:
        enabled: ${MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED:true}
        url: ${MANAGEMENT_OTLP_METRICS_EXPORT_URL:http://localhost:4318/v1/metrics}
        step: ${MANAGEMENT_OTLP_METRICS_EXPORT_STEP:5s}
  tracing:
    export:
      otlp:
        enabled: ${MANAGEMENT_OTLP_TRACING_EXPORT_ENABLED:true}
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  logging:
    export:
      otlp:
        enabled: ${MANAGEMENT_OTLP_LOGGING_EXPORT_ENABLED:true}
  server:
    port: ${MANAGEMENT_SERVER_PORT:9002}
