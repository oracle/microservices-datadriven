okafka:
  topic:
    tickets: ticket_event
  walletDir: ${WALLET_DIR:.}
  tnsAdmin: ${TNS_ALIAS:freepdb1}
  securityProtocol: ${OKAFKA_SECURITY_PROTOCOL:SSL}

oci:
  embeddingModelID: ${OCI_EMBEDDING_MODEL_ID:cohere.embed-english-v3.0}
  compartment: ${OCI_COMPARTMENT_ID}

spring:
  profiles:
    active: rest
  application:
    name: ${OTEL_SERVICE_NAME:customer-support-lab-v2}
  datasource:
    username: ${APP_DB_USERNAME}
    password: ${APP_DB_PASSWORD}
    url: ${JDBC_URL:jdbc:oracle:thin:@localhost:1521/freepdb1}

    driver-class-name: oracle.jdbc.OracleDriver
    type: oracle.ucp.jdbc.PoolDataSource
    oracleucp:
      initial-pool-size: 1
      min-pool-size: 1
      max-pool-size: 30
      connection-pool-name: DemoConnectionPool
      connection-factory-class-name: oracle.jdbc.pool.OracleDataSource
  jpa:
    hibernate:
      ddl-auto: create-drop

server:
  port: 9001
management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
  opentelemetry:
    resource-attributes:
      service.name: ${OTEL_SERVICE_NAME:${spring.application.name}}
  otlp:
    metrics:
      export:
        enabled: ${MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED:true}
        url: ${MANAGEMENT_OTLP_METRICS_EXPORT_URL:http://localhost:4318/v1/metrics}
        step: ${MANAGEMENT_OTLP_METRICS_EXPORT_STEP:5s}
    tracing:
      export:
        enabled: ${MANAGEMENT_OTLP_TRACING_EXPORT_ENABLED:true}
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
    logging:
      export:
        enabled: ${MANAGEMENT_OTLP_LOGGING_EXPORT_ENABLED:true}
      endpoint: ${MANAGEMENT_OTLP_LOGGING_ENDPOINT:http://localhost:4318/v1/logs}
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  server:
    port: ${MANAGEMENT_SERVER_PORT:9002}
