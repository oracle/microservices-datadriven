spring:
  ai:
    model:
      chat: oci-genai
      embedding: oci-genai
    oci:
      genai:
        authentication-type: ${OCI_AUTHENTICATION_TYPE:FILE}
        config-file: ${OCI_CONFIG_FILE:${user.home}/.oci/config}
        profile: ${OCI_PROFILE:DEFAULT}
        chat:
          compartment-id: ${OCI_COMPARTMENT_ID}
          serving-mode: ON_DEMAND
          model: ${OCI_CHAT_MODEL_ID:cohere.command-a-03-2025}
          temperature: 0.2
          max-tokens: 512
        embedding:
          compartment-id: ${OCI_COMPARTMENT_ID}
          serving-mode: ON_DEMAND
          model: ${OCI_EMBEDDING_MODEL_ID:cohere.embed-v4.0}
          dimensions: 1536
          truncate: END
app:
  ai:
    chat-model-id: ${OCI_CHAT_MODEL_ID:cohere.command-a-03-2025}
