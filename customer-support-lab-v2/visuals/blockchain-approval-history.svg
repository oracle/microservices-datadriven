<title>Blockchain approval history</title><desc>A saved AI summary is reviewed by a human. The approval or rejection is appended to an Oracle blockchain table with a summary snapshot, digest, self-declared reviewer, and model metadata. Retry requests reuse the action UUID. The lab records reviews without executing customer actions.</desc>
