<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
<title id="title">Save AI results beside the ticket</title>
<desc id="desc">AI schema relationships from db/init.sql. One ticket can own zero or one ticket_assistance row and zero or many related_ticket and ticket_policy_match rows. A policy can be referenced by zero or many ticket_policy_match rows. ticket_assistance stores a summary, summary_model, prompt_version, and generated_at. Composite primary keys prevent duplicate matches. The related column stores the matched ticket ID but does not have a foreign key. Both embedding columns are VECTOR(1536, FLOAT32). PolicyIndex fills missing policy vectors at AI startup; matches and assistance are saved with the ticket enrichment transaction. Rejected reviews append feedback to the ticket and request regeneration through TxEventQ. The current assistance and scored matches are replaced on regeneration; reviewed snapshots stay in blockchain history.</desc>
