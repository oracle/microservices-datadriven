<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
<title id="title">AI assistance for human review</title><desc id="desc">The processor calls OCI for an embedding, runs exact cosine vector search in Oracle for related tickets and policies, generates a summary from the ticket text alone, then saves assistance and ENRICHED status. Matches are for human review, not chat prompt context.</desc>
