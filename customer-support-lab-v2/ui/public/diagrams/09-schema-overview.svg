<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
<title id="title">Eight tables, one ticket workflow</title>
<desc id="desc">Eight application tables from db/init.sql, grouped by their consuming features. All tables are created at database bootstrap regardless of active profiles. Core processing uses support_ticket, ticket_event_processed, and failed_ticket_event. Optional AI uses support_policy, ticket_assistance, related_ticket, and ticket_policy_match. Optional blockchain review uses ticket_approval_history. TxEventQ backing objects are prepared separately by the application.</desc>
