<section class="chapter" aria-label="2. Two commits, one database" data-chapter="2"><div class="ordinal" aria-hidden="true">02</div><figure class="frame"><svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title-1 desc-1">
<title id="title-1">Two commits, one database</title><desc id="desc-1">The producer atomically commits the ticket and event. In a separate transaction, the consumer commits its database outcome and queue acknowledgement. External OCI calls are outside these database atomicity guarantees.</desc>

<title id="title-2">Failure is a recoverable state</title><desc id="desc-2">Retryable failures roll back attempt writes to a savepoint. Success or durable failure commits with acknowledgement. Replay marks the failure replayed and publishes a new event atomically; causation links the old event. OCI calls may repeat.</desc>

<title id="title-3">AI assistance for human review</title><desc id="desc-3">The processor calls OCI for an embedding, runs exact cosine vector search in Oracle for related tickets and policies, generates a summary from the ticket text alone, then saves assistance and ENRICHED status. Matches are for human review, not chat prompt context.</desc>

<section class="chapter" aria-label="5. Offload freshness-tolerant reads" data-chapter="5"><div class="ordinal" aria-hidden="true">05</div><figure class="frame"><svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title-4 desc-4">
<title id="title-4">Offload freshness-tolerant reads</title><desc id="desc-4">Oracle primary redo feeds True Cache. Ticket GETs default to True Cache and can lag committed writes. Explicit primary reads bypass cache; connection unavailability falls back to primary, while a successful cache miss remains 404.</desc>

<title id="title-5">See outcomes and read paths</title><desc id="desc-5">The application sends metrics and traces over OTLP to Grafana LGTM. Workflow and UCP dashboards expose outcomes and read paths. Console logs have no automatic LGTM forwarding; JDBC tracing does not guarantee all OKafka internal spans.</desc>

<section class="chapter" aria-label="8. Preserve the human decision" data-chapter="8"><div class="ordinal" aria-hidden="true">08</div><figure class="frame"><svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title-7 desc-7">
<title id="title-7">Preserve the human decision</title><desc id="desc-7">With events, ai, and blockchain active, human review preserves the saved summary in blockchain history. Approval accepts the summary. Rejection requires feedback, appends it to the ticket, resets its status to RECEIVED, and publishes TICKET_FEEDBACK_SUBMITTED using the same OKafka transaction. The AI consumer regenerates the summary, embedding, and matches, returning the ticket to ENRICHED. Duplicate review actions do not publish again. Actor identity is supplied by the caller, not authenticated. Reviews do not execute customer actions.</desc>

<section class="chapter" id="schema-event-outcomes" aria-label="10. A ticket and its event outcomes" data-chapter="10"><div class="ordinal" aria-hidden="true">10</div><figure class="frame"><svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title-9 desc-9">
<title id="title-9">A ticket and its event outcomes</title>
<desc id="desc-9">support_ticket stores the business record with RECEIVED, TRIAGED, ENRICHED, or FAILED status and an optional 1536-dimensional FLOAT32 vector. ticket_event_processed records successful event UUIDs. failed_ticket_event records failed envelopes, attempts, failure type and FAILED or REPLAYED state. Arrows here show application associations, not declared foreign keys; both event tables allow nullable ticket IDs without foreign keys. The consumer checks both outcome tables to suppress duplicates, and commits the ticket changes, event outcome, and queue acknowledgement in one transaction.</desc>

<section class="chapter" id="schema-ai-relationships" aria-label="11. Save AI results beside the ticket" data-chapter="11"><div class="ordinal" aria-hidden="true">11</div><figure class="frame"><svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title-10 desc-10">
<title id="title-10">Save AI results beside the ticket</title>
<desc id="desc-10">AI schema relationships from db/init.sql. One ticket can own zero or one ticket_assistance row and zero or many related_ticket and ticket_policy_match rows. A policy can be referenced by zero or many ticket_policy_match rows. ticket_assistance stores a summary, summary_model, prompt_version, and generated_at. Composite primary keys prevent duplicate matches. The related column stores the matched ticket ID but does not have a foreign key. Both embedding columns are VECTOR(1536, FLOAT32). PolicyIndex fills missing policy vectors at AI startup; matches and assistance are saved with the ticket enrichment transaction. Rejected reviews append feedback to the ticket and request regeneration through TxEventQ. The current assistance and scored matches are replaced on regeneration; reviewed snapshots stay in blockchain history.</desc>

<section class="chapter" id="schema-replay" aria-label="12. Replay preserves the failure record" data-chapter="12"><div class="ordinal" aria-hidden="true">12</div><figure class="frame"><svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title-11 desc-11">
<title id="title-11">Replay preserves the failure record</title>
<desc id="desc-11">Replay locks failed_ticket_event A while its status is FAILED, marks it REPLAYED, resets the same support_ticket from FAILED to RECEIVED, and publishes event B in one producer transaction. The new event has a new UUID, causation_id A, and the original correlation_id. The dashed card represents a queue event, not another application table. The original failure remains recorded and continues to suppress duplicate delivery of A. If B fails, it gets its own failure row.</desc>

<section class="chapter" id="schema-approval-history" aria-label="13. Keep the exact summary reviewed" data-chapter="13"><div class="ordinal" aria-hidden="true">13</div><figure class="frame"><svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title-12 desc-12">
<title id="title-12">Keep the exact summary reviewed</title>
<desc id="desc-12">ticket_approval_history is an Oracle V2 blockchain table. It has a primary key action_id and a foreign key to support_ticket.id. The application requires saved assistance for an ENRICHED ticket and copies the summary, chat model and prompt version into the review record. The dashed arrow is an application-level copy, not a foreign key to ticket_assistance. The summary_digest is application-computed SHA-256; blockchain row hashing separately uses SHA2-512. Reviews store actor ID, reason, APPROVED or REJECTED decision, and UTC decision time. Rows have 16-day retention and the table allows deliberate lab drop with zero idle days. Approval leaves ticket workflow status ENRICHED. Rejection appends feedback to support_ticket.review_feedback, resets status to RECEIVED and requests regeneration through TxEventQ, atomically with this review. No review executes customer actions.</desc>

<section class="chapter" id="complete-event-loop" aria-label="14. One ticket, a complete event loop" data-chapter="14"><div class="ordinal" aria-hidden="true">14</div><figure class="frame"><svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title-13 desc-13">
<title id="title-13">One ticket, a complete event loop</title>
<desc id="desc-13">The complete ticket workflow. TicketEventProducer atomically inserts a RECEIVED ticket and publishes TICKET_SUBMITTED to the ticket_event topic in Oracle TxEventQ. The AI consumer embeds the ticket, finds related tickets and policies, generates a summary, and commits ENRICHED assistance, event outcome, and queue acknowledgement together. Human review preserves the reviewed summary in blockchain history. APPROVED keeps the summary without generating another event or resolving the ticket. REJECTED requires written feedback: the dedicated feedback producer atomically saves the review, appends feedback to the ticket, resets it to RECEIVED, and publishes TICKET_FEEDBACK_SUBMITTED. The same consumer regenerates assistance using the previous summary and accumulated feedback. Both producer instances use the same configuration but own separate transaction connections. After bounded retries, or immediately for a nonretryable error, the consumer records FAILED and acknowledges the event; failed_ticket_event is a failure worklist, not a queue. Manual replay marks the original failure REPLAYED, resets the ticket, and publishes a new event preserving its type and causation. Each new published event has its own UUID; redelivered IDs with durable outcomes are skipped. Main coral arrows show normal delivery and the review loop; dashed arrows show failure and manual replay. All labels and arrows are visible without animation.</desc>

<script>
const chapters = [...document.querySelectorAll('.chapter')];
const dots = [...document.querySelectorAll('.rail span')];
const position = document.querySelector('.position');
const progress = document.querySelector('.progress');
const observer = new IntersectionObserver(entries => {
  for (const entry of entries) {
    entry.target.classList.toggle('active', entry.isIntersecting);
    if (entry.isIntersecting) {
      const index = Number(entry.target.dataset.chapter) - 1;
      position.textContent = `${String(index + 1).padStart(2, '0')} / 14`;
      dots.forEach((dot, n) => dot.classList.toggle('active', n === index));
    }
  }
}, { rootMargin: '-40% 0px -40% 0px', threshold: 0 });
chapters.forEach(chapter => observer.observe(chapter));
let scheduled = false;
function updateProgress() {
  const distance = document.documentElement.scrollHeight - innerHeight;
  progress.style.transform = `scaleX(${distance > 0 ? Math.min(1, Math.max(0, scrollY / distance)) : 1})`;
  scheduled = false;
}
addEventListener('scroll', () => {
  if (!scheduled) { scheduled = true; requestAnimationFrame(updateProgress); }
}, { passive: true });
addEventListener('resize', updateProgress);
updateProgress();
</script>
