<title id="title">Customer Support Lab v2 — sneak preview</title><desc id="description">A 48-second, six-scene tour: Vue and Spring Boot connect to Oracle AI Database; TxEventQ uses OKafka and OSON for transactional events; Spring AI calls OCI Generative AI and Oracle vector search; human reviews save blockchain snapshots and feed corrections back to the queue; failures can be replayed; True Cache serves default ticket reads and Grafana LGTM receives telemetry. AI, blockchain reviews, and telemetry require the optional lab profiles. Static and reduced-motion renderers show the opening overview.</desc>

play.onclick=()=>{svg.classList.remove('still');chapter.value='';paused=!paused;svg.classList.toggle('paused',paused);play.textContent=paused?'Play':'Pause';play.setAttribute('aria-pressed',String(paused));};
document.querySelector('#restart').onclick=()=>{svg.classList.remove('paused','still');svg.style.display='none';void svg.getBoundingClientRect();svg.style.display='';paused=false;chapter.value='';play.textContent='Pause';play.setAttribute('aria-pressed','false');};
chapter.onchange=()=>{svg.classList.toggle('still',chapter.value!=='');document.querySelectorAll('.scene').forEach((s,i)=>s.classList.toggle('selected',String(i)===chapter.value));};
