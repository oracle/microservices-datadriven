<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
<title id="title">The session goes further</title><desc id="desc">Session scope comparison, not an architecture claim. Regional placement is a deployment concept; MicroTx remains future work. The concurrently added blockchain chapter records human reviews of saved summaries. The lab demonstrates reliability mechanisms but is not production-secure.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#ff967b" /></marker><radialGradient id="canvas-wash" cx="15%" cy="0%" r="105%"><stop offset="0%" stop-color="#20334a" /><stop offset="65%" stop-color="#0e1928" /><stop offset="100%" stop-color="#0a121e" /></radialGradient><linearGradient id="card-surface" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1d2d42" /><stop offset="100%" stop-color="#152234" /></linearGradient></defs>
<style>
.focus {animation:focus 8s ease-in-out infinite} .signal {animation:travel 8s linear infinite; opacity:0}
@keyframes focus {0%,28%,100%{stroke:#34495f} 8%,20%{stroke:#ff967b}} 
@keyframes travel {0%{stroke-dashoffset:25;opacity:0} 8%{opacity:1} 38%{stroke-dashoffset:-480;opacity:0} 100%{stroke-dashoffset:-480;opacity:0}}
@media (prefers-reduced-motion:reduce) {.focus,.signal{animation:none} .signal{display:none}}
.paused * {animation-play-state:paused!important}
</style>
<rect width="800" height="600" fill="url(#canvas-wash)" />
<text x="48" y="98" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#f3f0e9" text-anchor="start">The session goes further</text><text x="48" y="135" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#a7b7c9" text-anchor="start">Demo extends beyond the local deployment.</text>
<g data-role="diagram"><rect x="48" y="183" width="704" height="88" rx="16" fill="#122032" /><text x="70" y="215" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#f3f0e9" text-anchor="start">Implemented: TxEventQ, retries, True Cache, OCI AI,</text><text x="70" y="244" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#f3f0e9" text-anchor="start">and Oracle AI Vector Search.</text><g><rect class="focus" style="animation-delay:0s" x="48" y="295" width="216" height="145" rx="18" fill="url(#card-surface)" stroke="#34495f" stroke-width="2" /><text x="156.0" y="335" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#f3f0e9" text-anchor="middle">Regional data</text><text x="156.0" y="365" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#f3f0e9" text-anchor="middle">placement</text><text x="156.0" y="395" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#f3f0e9" text-anchor="middle">Concept only</text></g><g><rect class="focus" style="animation-delay:2s" x="292" y="295" width="216" height="145" rx="18" fill="url(#card-surface)" stroke="#34495f" stroke-width="2" /><text x="400.0" y="335" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#f3f0e9" text-anchor="middle">Blockchain</text><text x="400.0" y="365" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#f3f0e9" text-anchor="middle">approval history</text><text x="400.0" y="395" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#f3f0e9" text-anchor="middle">Optional chapter</text></g><g><rect class="focus" style="animation-delay:4s" x="536" y="295" width="216" height="145" rx="18" fill="url(#card-surface)" stroke="#34495f" stroke-width="2" /><text x="644.0" y="335" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#f3f0e9" text-anchor="middle">MicroTx</text><text x="644.0" y="365" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#f3f0e9" text-anchor="middle">Cross-service work</text><text x="644.0" y="395" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#f3f0e9" text-anchor="middle">Not implemented</text></g><text x="48" y="493" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#f3f0e9" text-anchor="start">This is a teaching workflow, with unauthenticated local APIs.</text></g>
