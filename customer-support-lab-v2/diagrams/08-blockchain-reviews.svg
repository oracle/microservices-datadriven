idth="704" height="88" rx="16" fill="#122032" /><text x="70" y="442" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#f3f0e9" text-anchor="start">Store the summary snapshot, digest, model, and decision.</text><text x="70" y="471" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#f3f0e9" text-anchor="start">Reviews do not change ticket state or execute actions.</text></g>
