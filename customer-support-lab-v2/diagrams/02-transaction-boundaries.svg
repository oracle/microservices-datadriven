<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
<title id="title">Two commits, one database</title><desc id="desc">The producer atomically commits the ticket and event. In a separate transaction, the consumer commits its database outcome and queue acknowledgement. External OCI calls are outside these database atomicity guarantees.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#ff967b" /></marker><radialGradient id="canvas-wash" cx="15%" cy="0%" r="105%"><stop offset="0%" stop-color="#20334a" /><stop offset="65%" stop-color="#0e1928" /><stop offset="100%" stop-color="#0a121e" /></radialGradient><linearGradient id="card-surface" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1d2d42" /><stop offset="100%" stop-color="#152234" /></linearGradient></defs>
<style>
.focus {animation:focus 8s ease-in-out infinite} .signal {animation:travel 8s linear infinite; opacity:0}
@keyframes focus {0%,28%,100%{stroke:#34495f} 8%,20%{stroke:#ff967b}} 
@keyframes travel {0%{stroke-dashoffset:25;opacity:0} 8%{opacity:1} 38%{stroke-dashoffset:-480;opacity:0} 100%{stroke-dashoffset:-480;opacity:0}}
@media (prefers-reduced-motion:reduce) {.focus,.signal{animation:none} .signal{display:none}}
.paused * {animation-play-state:paused!important}
</style>
<rect width="800" height="600" fill="url(#canvas-wash)" />
<text x="48" y="98" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#f3f0e9" text-anchor="start">Two commits, one database</text><text x="48" y="135" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#a7b7c9" text-anchor="start">OKafka exposes TxEventQ through Kafka-style Java APIs.</text>
<g data-role="diagram"><rect x="48" y="180" width="704" height="320" rx="24" fill="#122032" /><text x="70" y="218" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#f3f0e9" text-anchor="start">Oracle AI Database</text><path d="M350 305 H450" fill="none" stroke="#ff967b" stroke-width="3" marker-end="url(#arrow)" /><path class="signal" style="animation-delay:0s" d="M350 305 H450" fill="none" stroke="#ff967b" stroke-width="6" stroke-linecap="round" stroke-dasharray="10 500" /><path d="M350 425 H450" fill="none" stroke="#ff967b" stroke-width="3" marker-end="url(#arrow)" /><path class="signal" style="animation-delay:3s" d="M350 425 H450" fill="none" stroke="#ff967b" stroke-width="6" stroke-linecap="round" stroke-dasharray="10 500" /><g><rect class="focus" style="animation-delay:0s" x="70" y="250" width="280" height="100" rx="18" fill="url(#card-surface)" stroke="#34495f" stroke-width="2" /><text x="210.0" y="290" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#f3f0e9" text-anchor="middle">Ticket insert</text><text x="210.0" y="320" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#f3f0e9" text-anchor="middle">+ event publish</text></g><g><rect class="focus" style="animation-delay:0s" x="450" y="250" width="280" height="100" rx="18" fill="url(#card-surface)" stroke="#34495f" stroke-width="2" /><text x="590.0" y="290" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#f3f0e9" text-anchor="middle">Producer commit</text></g><g><rect class="focus" style="animation-delay:3s" x="70" y="370" width="280" height="100" rx="18" fill="url(#card-surface)" stroke="#34495f" stroke-width="2" /><text x="210.0" y="410" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#f3f0e9" text-anchor="middle">Outcome writes</text><text x="210.0" y="440" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#f3f0e9" text-anchor="middle">+ acknowledgement</text></g><g><rect class="focus" style="animation-delay:3s" x="450" y="370" width="280" height="100" rx="18" fill="url(#card-surface)" stroke="#34495f" stroke-width="2" /><text x="590.0" y="410" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#f3f0e9" text-anchor="middle">Consumer commit</text></g></g>
</svg>
