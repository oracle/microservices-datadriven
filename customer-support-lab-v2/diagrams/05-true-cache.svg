<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
<title id="title">Offload freshness-tolerant reads</title><desc id="desc">Oracle primary redo feeds True Cache. Ticket GETs default to True Cache and can lag committed writes. Explicit primary reads bypass cache; connection unavailability falls back to primary, while a successful cache miss remains 404.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#ff967b" /></marker><radialGradient id="canvas-wash" cx="15%" cy="0%" r="105%"><stop offset="0%" stop-color="#20334a" /><stop offset="65%" stop-color="#0e1928" /><stop offset="100%" stop-color="#0a121e" /></radialGradient><linearGradient id="card-surface" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1d2d42" /><stop offset="100%" stop-color="#152234" /></linearGradient></defs>
<style>
.focus {animation:focus 8s ease-in-out infinite} .signal {animation:travel 8s linear infinite; opacity:0}
@keyframes focus {0%,28%,100%{stroke:#34495f} 8%,20%{stroke:#ff967b}} 
@keyframes travel {0%{stroke-dashoffset:25;opacity:0} 8%{opacity:1} 38%{stroke-dashoffset:-480;opacity:0} 100%{stroke-dashoffset:-480;opacity:0}}
@media (prefers-reduced-motion:reduce) {.focus,.signal{animation:none} .signal{display:none}}
.paused * {animation-play-state:paused!important}
</style>
<rect width="800" height="600" fill="url(#canvas-wash)" />
<text x="48" y="98" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#f3f0e9" text-anchor="start">Offload freshness-tolerant reads</text><text x="48" y="135" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#a7b7c9" text-anchor="start">Writes and explicit fresh reads stay on the primary.</text>
<g data-role="diagram"><path d="M290 270 H510" fill="none" stroke="#ff967b" stroke-width="3" marker-end="url(#arrow)" /><path class="signal" style="animation-delay:0s" d="M290 270 H510" fill="none" stroke="#ff967b" stroke-width="6" stroke-linecap="round" stroke-dasharray="10 500" /><path d="M480 400 H628 V340" fill="none" stroke="#ff967b" stroke-width="3" marker-end="url(#arrow)" /><path class="signal" style="animation-delay:2s" d="M480 400 H628 V340" fill="none" stroke="#ff967b" stroke-width="6" stroke-linecap="round" stroke-dasharray="10 500" /><path d="M320 400 H172 V340" fill="none" stroke="#ff967b" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="7 7" /><path class="signal" style="animation-delay:5s" d="M320 400 H172 V340" fill="none" stroke="#ff967b" stroke-width="6" stroke-linecap="round" stroke-dasharray="10 500" /><g><rect class="focus" style="animation-delay:0s" x="48" y="210" width="242" height="130" rx="18" fill="url(#card-surface)" stroke="#34495f" stroke-width="2" /><text x="169.0" y="250" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#f3f0e9" text-anchor="middle">Oracle primary</text><text x="169.0" y="280" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#f3f0e9" text-anchor="middle">Writes + fresh reads</text></g><g><rect class="focus" style="animation-delay:2s" x="510" y="210" width="242" height="130" rx="18" fill="url(#card-surface)" stroke="#34495f" stroke-width="2" /><text x="631.0" y="250" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#f3f0e9" text-anchor="middle">True Cache</text><text x="631.0" y="280" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#f3f0e9" text-anchor="middle">Read-only replica</text></g><g><rect class="focus" style="animation-delay:4s" x="320" y="355" width="160" height="90" rx="18" fill="url(#card-surface)" stroke="#34495f" stroke-width="2" /><text x="400.0" y="395" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#f3f0e9" text-anchor="middle">Ticket GETs</text><text x="400.0" y="425" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#f3f0e9" text-anchor="middle">Default</text></g><text x="400" y="250" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#a7b7c9" text-anchor="middle">Redo</text><text x="515" y="389" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#a7b7c9" text-anchor="start">Read</text><text x="80" y="430" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#a7b7c9" text-anchor="start">Fallback / fresh</text><rect x="48" y="476" width="704" height="59" rx="16" fill="#122032" /><text x="70" y="508" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#f3f0e9" text-anchor="start">Redo lag can delay visibility; a cache miss remains a 404.</text></g>
</svg>
