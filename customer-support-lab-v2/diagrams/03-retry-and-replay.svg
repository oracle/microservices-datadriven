<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
<title id="title">Failure is a recoverable state</title><desc id="desc">Retryable failures roll back attempt writes to a savepoint. Success or durable failure commits with acknowledgement. Replay marks the failure replayed and publishes a new event atomically; causation links the old event. OCI calls may repeat.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#ff967b" /></marker><radialGradient id="canvas-wash" cx="15%" cy="0%" r="105%"><stop offset="0%" stop-color="#20334a" /><stop offset="65%" stop-color="#0e1928" /><stop offset="100%" stop-color="#0a121e" /></radialGradient><linearGradient id="card-surface" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1d2d42" /><stop offset="100%" stop-color="#152234" /></linearGradient></defs>
<style>
.focus {animation:focus 8s ease-in-out infinite} .signal {animation:travel 8s linear infinite; opacity:0}
@keyframes focus {0%,28%,100%{stroke:#34495f} 8%,20%{stroke:#ff967b}} 
@keyframes travel {0%{stroke-dashoffset:25;opacity:0} 8%{opacity:1} 38%{stroke-dashoffset:-480;opacity:0} 100%{stroke-dashoffset:-480;opacity:0}}
@media (prefers-reduced-motion:reduce) {.focus,.signal{animation:none} .signal{display:none}}
.paused * {animation-play-state:paused!important}
</style>
<rect width="800" height="600" fill="url(#canvas-wash)" />
<text x="48" y="98" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#f3f0e9" text-anchor="start">Failure is a recoverable state</text><text x="48" y="135" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#a7b7c9" text-anchor="start">Retries use savepoint rollback and exponential backoff.</text>
<g data-role="diagram"><path d="M248 260 H294" fill="none" stroke="#ff967b" stroke-width="3" marker-end="url(#arrow)" /><path class="signal" style="animation-delay:0s" d="M248 260 H294" fill="none" stroke="#ff967b" stroke-width="6" stroke-linecap="round" stroke-dasharray="10 500" /><path d="M506 260 H552" fill="none" stroke="#ff967b" stroke-width="3" marker-end="url(#arrow)" /><path class="signal" style="animation-delay:2s" d="M506 260 H552" fill="none" stroke="#ff967b" stroke-width="6" stroke-linecap="round" stroke-dasharray="10 500" /><path d="M652 340 V405 H506" fill="none" stroke="#ff967b" stroke-width="3" marker-end="url(#arrow)" /><path class="signal" style="animation-delay:4s" d="M652 340 V405 H506" fill="none" stroke="#ff967b" stroke-width="6" stroke-linecap="round" stroke-dasharray="10 500" /><g><rect class="focus" style="animation-delay:0s" x="48" y="200" width="200" height="140" rx="18" fill="url(#card-surface)" stroke="#34495f" stroke-width="2" /><text x="148.0" y="240" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#f3f0e9" text-anchor="middle">Process event</text><text x="148.0" y="270" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#f3f0e9" text-anchor="middle">Up to 3 attempts</text></g><g><rect class="focus" style="animation-delay:2s" x="294" y="200" width="212" height="140" rx="18" fill="url(#card-surface)" stroke="#34495f" stroke-width="2" /><text x="400.0" y="240" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#f3f0e9" text-anchor="middle">Save outcome</text><text x="400.0" y="270" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#f3f0e9" text-anchor="middle">Success or FAILED</text></g><g><rect class="focus" style="animation-delay:4s" x="552" y="200" width="200" height="140" rx="18" fill="url(#card-surface)" stroke="#34495f" stroke-width="2" /><text x="652.0" y="240" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#f3f0e9" text-anchor="middle">Commit</text><text x="652.0" y="270" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#f3f0e9" text-anchor="middle">Acknowledge</text></g><g><rect class="focus" style="animation-delay:5s" x="294" y="370" width="212" height="100" rx="18" fill="url(#card-surface)" stroke="#34495f" stroke-width="2" /><text x="400.0" y="410" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#f3f0e9" text-anchor="middle">Replay failure</text><text x="400.0" y="440" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#f3f0e9" text-anchor="middle">New event ID</text></g><path d="M294 420 H148 V340" fill="none" stroke="#ff967b" stroke-width="3" marker-end="url(#arrow)" /><path class="signal" style="animation-delay:5s" d="M294 420 H148 V340" fill="none" stroke="#ff967b" stroke-width="6" stroke-linecap="round" stroke-dasharray="10 500" /><text x="545" y="391" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#a7b7c9" text-anchor="start">If FAILED</text><text x="48" y="519" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#f3f0e9" text-anchor="start">Durable outcomes skip duplicate processing on redelivery.</text></g>
</svg>
