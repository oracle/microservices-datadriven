{{ if and .Release.IsUpgrade (eq (include "obaas.signozUpgrade.stage" .) "stage1") .Values.signoz.enabled }}
{{- $hookNameBase := printf "%s-%s-signoz-snapshot" .Release.Name .Release.Namespace -}}
{{- $hookNameHash := $hookNameBase | sha256sum | trunc 8 -}}
{{- $hookName := printf "%s-%s" ($hookNameBase | trunc 54 | trimSuffix "-") $hookNameHash -}}
{{- $hookAnnotations := dict "helm.sh/hook" "pre-upgrade" "helm.sh/hook-weight" "-30" "helm.sh/hook-delete-policy" "before-hook-creation,hook-succeeded" -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $hookName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- toYaml $hookAnnotations | nindent 4 }}
{{- with .Values.global.imagePullSecretName }}
imagePullSecrets:
  - name: {{ . }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $hookName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- toYaml $hookAnnotations | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "persistentvolumeclaims"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "delete"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["create", "get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $hookName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- toYaml $hookAnnotations | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $hookName }}
subjects:
  - kind: ServiceAccount
    name: {{ $hookName }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $hookName }}
  annotations:
    {{- toYaml $hookAnnotations | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotclasses"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $hookName }}
  annotations:
    {{- toYaml $hookAnnotations | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $hookName }}
subjects:
  - kind: ServiceAccount
    name: {{ $hookName }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $hookName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-29"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: signoz-upgrade-snapshot
    spec:
      serviceAccountName: {{ $hookName }}
      restartPolicy: Never
      containers:
        - name: create-snapshots
          image: {{ .Values.global.utilities.kubectl.image.registry }}/{{ .Values.global.utilities.kubectl.image.repository }}:{{ .Values.global.utilities.kubectl.image.tag }}
          imagePullPolicy: IfNotPresent
          env:
            - name: NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: RELEASE_NAME
              value: {{ .Release.Name | quote }}
            - name: RELEASE_REVISION
              value: {{ .Release.Revision | quote }}
            - name: TARGET_VERSION
              value: {{ .Values.signozUpgrade.target.chartVersion | quote }}
            - name: SNAPSHOT_TIMEOUT
              value: {{ .Values.signozUpgrade.backup.timeout | quote }}
            - name: MARKER_SECRET_NAME
              value: {{ include "obaas.signozUpgrade.markerSecretName" . | quote }}
            - name: SNAPSHOT_CLASS_NAME
              value: {{ .Values.signozUpgrade.backup.volumeSnapshotClassName | quote }}
            - name: SNAPSHOT_CLASS_MAPPINGS
              value: |-
                {{- range $storageClass, $snapshotClass := .Values.signozUpgrade.backup.volumeSnapshotClassByStorageClass }}
                {{ $storageClass }}{{ "\t" }}{{ $snapshotClass }}
                {{- end }}
            - name: TARGET_COMPONENTS
              value: "signoz clickhouse zookeeper"
          command:
            - /bin/sh
            - -c
          args:
            - |
              {{- .Files.Get "files/signoz-upgrade/create-snapshots.sh" | nindent 14 }}
{{- end }}
