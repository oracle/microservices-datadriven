{{ if and .Release.IsUpgrade (eq (include "obaas.signozUpgrade.stage" .) "stage1") .Values.signoz.enabled }}
{{- $base := printf "%s-%s-signoz-validate" .Release.Name .Release.Namespace -}}
{{- $hash := $base | sha256sum | trunc 8 -}}
{{- $name := printf "%s-%s" ($base | trunc 54 | trimSuffix "-") $hash -}}
{{- $annotations := dict "helm.sh/hook" "post-upgrade" "helm.sh/hook-weight" "20" "helm.sh/hook-delete-policy" "before-hook-creation,hook-succeeded" -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
{{- with .Values.global.imagePullSecretName }}
imagePullSecrets:
  - name: {{ . }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "persistentvolumeclaims", "secrets"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["get", "list"]
  - apiGroups: ["clickhouse.altinity.com"]
    resources: ["clickhouseinstallations"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-upgrade
    "helm.sh/hook-weight": "21"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: signoz-upgrade-validation
    spec:
      serviceAccountName: {{ $name }}
      restartPolicy: Never
      containers:
        - name: validate-clickhouse
          image: {{ .Values.global.utilities.kubectl.image.registry }}/{{ .Values.global.utilities.kubectl.image.repository }}:{{ .Values.global.utilities.kubectl.image.tag }}
          imagePullPolicy: IfNotPresent
          env:
            - name: NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: RELEASE_NAME
              value: {{ .Release.Name | quote }}
            - name: RELEASE_REVISION
              value: {{ .Release.Revision | quote }}
            - name: TARGET_VERSION
              value: {{ .Values.signozUpgrade.target.chartVersion | quote }}
            - name: CLICKHOUSE_VERSION
              value: {{ .Values.signozUpgrade.target.clickhouseVersion | quote }}
            - name: VALIDATION_TIMEOUT
              value: {{ .Values.signozUpgrade.validation.timeout | quote }}
            - name: MARKER_SECRET_NAME
              value: {{ include "obaas.signozUpgrade.markerSecretName" . | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              {{- .Files.Get "files/signoz-upgrade/validate-clickhouse.sh" | nindent 14 }}
{{- end }}
