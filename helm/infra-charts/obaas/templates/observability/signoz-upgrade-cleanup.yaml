{{ if and .Release.IsUpgrade (eq (include "obaas.signozUpgrade.stage" .) "stage2") .Values.signoz.enabled }}
{{- $base := printf "%s-%s-signoz-upgrade-cleanup" .Release.Name .Release.Namespace -}}
{{- $hash := $base | sha256sum | trunc 8 -}}
{{- $name := printf "%s-%s" ($base | trunc 54 | trimSuffix "-") $hash -}}
{{- $annotations := dict "helm.sh/hook" "pre-upgrade" "helm.sh/hook-weight" "-38" "helm.sh/hook-delete-policy" "before-hook-creation,hook-succeeded" -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  annotations: {{- toYaml $annotations | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  annotations: {{- toYaml $annotations | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "serviceaccounts"]
    verbs: ["get", "delete"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  annotations: {{- toYaml $annotations | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-37"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: signoz-upgrade-cleanup
    spec:
      serviceAccountName: {{ $name }}
      restartPolicy: Never
      containers:
        - name: cleanup
          image: {{ .Values.global.utilities.kubectl.image.registry }}/{{ .Values.global.utilities.kubectl.image.repository }}:{{ .Values.global.utilities.kubectl.image.tag }}
          imagePullPolicy: IfNotPresent
          env:
            - { name: NAMESPACE, value: {{ .Release.Namespace | quote }} }
            - { name: STATEFULSET_NAME, value: {{ include "obaas.signoz.fullname" . | quote }} }
            - { name: OIDC_MOCK_HOOK_NAME, value: {{ printf "%s-signoz-airgap-patch" .Release.Name | quote }} }
          command: ["/bin/sh", "-c"]
          args:
            - |
              {{- .Files.Get "files/signoz-upgrade/cleanup-signoz-oidc-mock.sh" | nindent 14 }}
{{- end }}
