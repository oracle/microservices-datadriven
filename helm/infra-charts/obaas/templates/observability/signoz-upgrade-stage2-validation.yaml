{{ if and .Release.IsUpgrade (eq (include "obaas.signozUpgrade.stage" .) "stage2") .Values.signoz.enabled }}
{{- $base := printf "%s-%s-signoz-stage2-validation" .Release.Name .Release.Namespace -}}
{{- $hash := $base | sha256sum | trunc 8 -}}
{{- $name := printf "%s-%s" ($base | trunc 54 | trimSuffix "-") $hash -}}
{{- $annotations := dict "helm.sh/hook" "post-upgrade" "helm.sh/hook-weight" "30" "helm.sh/hook-delete-policy" "before-hook-creation,hook-succeeded" -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  annotations: {{- toYaml $annotations | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  annotations: {{- toYaml $annotations | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  annotations: {{- toYaml $annotations | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-upgrade
    "helm.sh/hook-weight": "31"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: signoz-stage2-validation
    spec:
      serviceAccountName: {{ $name }}
      restartPolicy: Never
      initContainers:
        - name: validate-resources
          image: {{ .Values.global.utilities.kubectl.image.registry }}/{{ .Values.global.utilities.kubectl.image.repository }}:{{ .Values.global.utilities.kubectl.image.tag }}
          env:
            - { name: NAMESPACE, value: {{ .Release.Namespace | quote }} }
            - { name: RELEASE_NAME, value: {{ .Release.Name | quote }} }
            - { name: VALIDATION_TIMEOUT, value: {{ .Values.signozUpgrade.validation.timeout | quote }} }
            - { name: SIGNOZ_VERSION, value: {{ .Values.signozUpgrade.target.signozVersion | quote }} }
            - { name: COLLECTOR_VERSION, value: {{ .Values.signozUpgrade.target.otelCollectorVersion | quote }} }
          command: ["/bin/sh", "-c"]
          args:
            - |
              {{- .Files.Get "files/signoz-upgrade/validate-signoz-stage2.sh" | nindent 14 }}
      containers:
        - name: validate-data
          image: {{ .Values.signoz.utilities.curlJq.image.registry }}/{{ .Values.signoz.utilities.curlJq.image.repository }}:{{ .Values.signoz.utilities.curlJq.image.tag }}
          env:
            - name: SIGNOZ_URL
              value: {{ printf "http://%s-signoz:8080" .Release.Name | quote }}
            - name: COLLECTOR_URL
              value: {{ printf "http://%s-signoz-otel-collector:4318" .Release.Name | quote }}
            - name: CLICKHOUSE_URL
              value: {{ printf "http://%s-clickhouse:8123" .Release.Name | quote }}
            - name: CLICKHOUSE_PASSWORD
              value: {{ .Values.signoz.clickhouse.password | quote }}
            - name: BASELINE_ROWS
              valueFrom:
                secretKeyRef:
                  name: {{ include "obaas.signozUpgrade.markerSecretName" . }}
                  key: telemetryRows
          command: ["/bin/sh", "-c"]
          args:
            - |
              {{- .Files.Get "files/signoz-upgrade/validate-signoz-data.sh" | nindent 14 }}
{{- end }}
