{{- if .Values.coherence.enabled }}
{{- $clusterName := default (printf "%s-coherence-cluster" .Release.Name) .Values.coherence.name }}
---
apiVersion: coherence.oracle.com/v1
kind: Coherence
metadata:
  name: {{ $clusterName | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "obaas.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.coherence.replicas }}
  {{- with .Values.coherence.image }}
  image: {{ . | quote }}
  {{- end }}
  {{- include "obaas.imagePullSecrets" (dict "local" .Values.coherence.imagePullSecrets "global" .Values.global.imagePullSecrets "secretName" .Values.global.imagePullSecretName) | nindent 2 }}
  {{- with .Values.coherence.jvm }}
  jvm:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.coherence.ports }}
  ports:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.coherence.coherence }}
  coherence:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.coherence.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
